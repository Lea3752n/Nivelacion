<section id="contact" class="contact-section py-5">
  <div class="container">
    <!-- Descripción? -->
    <h2 class="section-title text-center mb-4">Contáctanos</h2>
    <p class="text-center mb-5">
      ¿Tenés dudas, sugerencias o querés colaborar con nosotros?
      Completá el formulario y te responderemos a la brevedad.
    </p>
    <!-- Formulario de contacto -->
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <form>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="ejemplo@email.com">
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribí tu mensaje..."></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-success">Enviar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
