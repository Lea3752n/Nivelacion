<!-- Carrusel de imágenes -->
<div id="carouselExample" class="carousel slide carousel-fade" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active" data-bs-interval="3000">
      <img src="/assets/Mesa10.png" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Mesa 10">
    </div>
    <div class="carousel-item" data-bs-interval="3000">
      <img src="/assets/Mesa11.png" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Mesa 11">
    </div>
    <div class="carousel-item" data-bs-interval="3000">
      <img src="/assets/Mesa12.png" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Mesa 12">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>
