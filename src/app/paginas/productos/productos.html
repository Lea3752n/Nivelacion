<section class="container-fluid d-flex flex-wrap justify-content-center gap-4 mt-4">
    @for(p of productos; track p.id){
    @if (p.disponible){

    <div class="card position-relative" style="width: 18rem;">
        <div class="position-absolute top-0 start-0 d-flex gap-1 p-2">
            <button class="btn btn-outline-danger">
                <i class="bi bi-heart-fill"></i>
            </button>
        </div>
        <img src="{{ p.imagen }}" class="card-img-top" alt="{{p.nombre}}">
        <div class="card-body">
            <h5 class="card-title">{{ p.nombre }}</h5>
            <p class="card-text">{{ p.descripcion }}</p>
            <p class="card-text">Precio: ${{ p.precio }}</p>
            <button class="btn btn-outline-warning me-2">
                <i class="bi bi-cart-plus-fill"></i>
            </button>
            <!-- Button trigger modal -->
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                Ver Detalles
            </button>
            <!-- Modal -->
            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">{{ p.nombre }}</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <!-- Carrusel -->
                            <div id="carouselExampleIndicators" class="carousel slide">
                                <div class="carousel-indicators ">
                                    <button type="button" data-bs-target="#carouselExampleIndicators"
                                        data-bs-slide-to="0" class="active" aria-current="true"
                                        aria-label="Slide 1"></button>
                                    <button type="button" data-bs-target="#carouselExampleIndicators"
                                        data-bs-slide-to="1" aria-label="Slide 2"></button>
                                    <button type="button" data-bs-target="#carouselExampleIndicators"
                                        data-bs-slide-to="2" aria-label="Slide 3"></button>
                                </div>
                                <div class="carousel-inner">
                                    <div class="carousel-item active">
                                        <img src="{{ p.imagen }}" class="d-block w-100" alt="...">
                                    </div>
                                    <div class="carousel-item">
                                        <img src="{{ p.imagen2 }}" class="d-block w-100" alt="...">
                                    </div>
                                    <div class="carousel-item">
                                        <img src="{{ p.imagen3 }}" class="d-block w-100" alt="...">
                                    </div>
                                </div>
                                <button class="carousel-control-prev text-dark" type="button"
                                    data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                                    <i class="bi bi-caret-left-fill"></i>
                                </button>
                                <button class="carousel-control-next text-dark" type="button"
                                    data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                                    <i class="bi bi-caret-right-fill"></i>
                                </button>
                            </div>
                            <div class="">
                                <h5 class="card-title">{{ p.nombre }}</h5>
                                <p class="card-text">{{ p.descripcion }}</p>
                                <p class="card-text">Precio: ${{ p.precio }}</p>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            <button type="button" class="btn btn-success"><i class="bi bi-cart-plus-fill"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    }

    }
</section>
