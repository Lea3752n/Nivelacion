<div class="container mt-4">
    <h3 class="mb-3">Carrito de Compras</h3>
    <!-- Mensaje por el carro vacío -->
    <div class="alert alert-info text-center">
        <p class="mb-0">El carrito está vacío. ¡Agrega productos!</p>
    </div>

    <!-- Tabla de productos -->
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <!-- Encabezado de la tabla -->
            <thead class="table-dark">
                <tr>
                    <th style="width: 80px;">Imagen</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th></th>
                </tr>
            </thead>
            <!-- Datos -->
            <tbody>
                <tr>
                    <td>
                        <img src="" alt="" class="rounded" style="width: 60px; height: 60px; object-fit: cover;">
                    </td>
                    <td class="fw-medium"></td>
                    <td>
                        <button class="btn btn-secondary">
                            <i class="bi bi-dash-lg"></i>
                        </button>
                        <span class="mx-2">1</span>
                        <button class="btn btn-secondary">
                            <i class="bi bi-plus-lg"></i>
                        </button>
                    </td>
                    <td class="text-success fw-bold">
                        <div class="price-container">
                            <span class="text-decoration-line-through text-muted small"></span>
                            <span class="text-danger fw-bold fs-5"></span>
                            <span class="text-dark fw-bold fs-5"></span>
                        </div>
                    </td>
                    <td>
                        <button class="btn btn-danger text-light fw-bold">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
            <!-- Pie de tabla -->
            <tfoot class="table-light">
                <tr>
                    <td colspan="3" class="fw-bold">Total a Pagar:</td>
                    <td class="text-success fs-5 fw-bold"></td>
                    <td></td>
                </tr>
            </tfoot>
        </table>

        <!-- Botón para vaciar el carrito -->
        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-lg btn-danger">
                Vaciar Carrito
            </button>
            <button class="btn btn-lg btn-success ms-2">
                Finalizar Compra
            </button>
        </div>
    </div>
</div>
