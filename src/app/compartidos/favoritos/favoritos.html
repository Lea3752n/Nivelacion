<div class="container mt-4">
    <h3 class="mb-3">Favoritos</h3>
    <!-- Mensaje por el carro vacío -->
    <div class="alert alert-info text-center">
        <p class="mb-0">No tienes productos favoritos.</p>
    </div>

    <!-- Tabla de productos -->
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <!-- Encabezado de la tabla -->
            <thead class="table-dark">
                <tr>
                    <th style="width: 80px;">Imagen</th>
                    <th>Producto</th>
                    <th>Descripción</th>
                    <th></th>
                    <th></th>
                    <th>Precio</th>
                    <th></th>
                </tr>
            </thead>
            <!-- Datos -->
            <tbody>
                <tr>
                    <td>
                        <img src="" alt="" class="rounded" style="width: 60px; height: 60px; object-fit: cover;">
                    </td>
                    <!-- Nombre del producto -->
                    <td class="fw-medium"></td>
                    <!-- Descripción -->
                    <td colspan="3"></td>
                    <!-- Precio -->
                    <td class="text-success fw-bold">
                        <div class="price-container">
                            <span class="text-decoration-line-through text-muted small"></span>
                            <span class="text-danger fw-bold fs-5"></span>
                            <span class="text-dark fw-bold fs-5"></span>
                        </div>
                    </td>
                    <!-- Botón para eliminar del favoritos -->
                    <td>
                        <button class="btn btn-danger text-light fw-bold me-2">
                            <i class="bi bi-heartbreak-fill" style="font-size: 120%;"></i>
                        </button>
                        <!-- Botón para agregar al carrito -->
                        <button class="btn btn-success text-light fw-bold">
                            <i class="bi bi-cart-plus-fill"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
