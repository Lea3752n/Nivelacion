<section class="">
    <div id="registro" class="contact-section py5">
        <div class="container">
            <!-- Descripción? -->
            <h2 class="section-title text-center mb-4">Registro</h2>
            <!-- Formulario de contacto -->
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico:</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@email.com">
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono:</label>
                            <input type="tel" class="form-control" id="telefono" placeholder="Tu número de teléfono">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña:</label>
                            <input type="password" class="form-control" id="password"
                                placeholder="Ingresá tu contraseña">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Confirmar contraseña:</label>
                            <input type="password" class="form-control" id="confirmarPassword"
                                placeholder="Confirmá tu contraseña">
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-success">Registrarse</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</section>
